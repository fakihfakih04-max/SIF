<script>
const $=id=>document.getElementById(id), API="/api";
const contentEl=document.getElementById("content");
let demo=true, productsData=[], customersData=[];
async function login(){
  err.textContent="Signing in...";
  const username=u.value.trim(), password=p.value;

  // Real backend authentication when the server is available.
  try{
    const r=await fetch("/api/login",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({username,password})
    });
    const d=await r.json().catch(()=>({}));
    if(r.ok){
      sessionStorage.setItem("sifUser",JSON.stringify(d.user));
      openSIF();
      return;
    }
    if(r.status===401){
      err.textContent=d.detail||"Invalid username or password.";
      return;
    }
  }catch(e){
    // Server unavailable: continue with local admin demo so the UI is not blocked.
  }

  // Local login for testing/offline UI.
  if(username==="admin" && password==="admin"){
    sessionStorage.setItem("sifUser",JSON.stringify({username:"admin",role:"admin",offline:true}));
    openSIF();
  }else{
    err.textContent="Invalid username or password.";
  }
}

function openSIF(){
  document.getElementById("login").classList.add("hidden");
  document.getElementById("app").classList.remove("hidden");
  if(typeof dashboard==="function") dashboard();
}
function logout(){location.reload()}
document.querySelectorAll("#nav button").forEach(b=>b.onclick=()=>{document.querySelectorAll("#nav button").forEach(x=>x.classList.remove("active"));b.classList.add("active");page(b.dataset.page);side.classList.remove("open")});
function page(p){({dashboard,products:liveProductsPage,barcodes:barcodeCenterPage,pos:livePOSPage,mobile:()=>catalogPage('Mobile Phones','Mobile Phones','Phones with photo, price, barcode and stock.'),computers:()=>catalogPage('Computers','Computers & Laptops','Laptops and computers with photo, price, barcode and stock.'),accessories:()=>catalogPage('Accessories','Accessories','Accessories with photo, price, barcode and stock.'),repairs,customers,suppliers,purchases,sales,expenses,stock:stockLivePage,reports,users,settings}[p]||dashboard)()}
function head(t,s,btn=""){return `<div class="head"><div><h1>${t}</h1><p>${s}</p></div>${btn}</div>`}
async function dashboard(){
  await loadSettings();
  contentEl.innerHTML=head("Dashboard","Real-time overview of your SIF Mobile & Computer business.",`<button class="btn light" onclick="dashboard()">↻ Refresh</button> <button class="btn primary" onclick="page('pos')">＋ New Sale</button>`)+`
  <div id="dashRoot"><div class="card dash-empty">Loading dashboard...</div></div>`;
  try{
    const d=await apiJSON('/api/dashboard');
    if(d.diagnostic && d.diagnostic.error_count){
      console.warn('SIF dashboard diagnostics:', d.errors);
    }
    const t=d.totals||{}, today=d.today||{};
    const fmt=n=>moneyDual(Number(n||0));
    const series=d.sales_7_days||[];
    const max=Math.max(1,...series.map(x=>Number(x.total||0)));
    const chart=series.map(x=>{const h=Math.max(2,(Number(x.total||0)/max)*100);const dt=new Date(x.date+'T00:00:00');const day=dt.toLocaleDateString(undefined,{weekday:'short'});return `<div class="dash-chart-col"><div class="dash-bar-wrap"><div class="dash-bar" style="height:${h}%" title="${esc2(x.date)} — $${Number(x.total||0).toFixed(2)}"><em>$${Number(x.total||0).toFixed(0)}</em></div></div><div class="dash-day">${day}</div></div>`}).join('');
    const repairs=d.repair_status||{};
    const repairRows=Object.entries(repairs).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="dash-list-row"><span>${esc2(k.replace(/_/g,' ').replace(/\b\w/g,m=>m.toUpperCase()))}</span><span class="dash-pill">${v}</span></div>`).join('')||`<div class="dash-empty">No repair tickets yet.</div>`;
    const top=(d.top_products||[]).map((x,i)=>`<tr><td><b>${i+1}</b></td><td><b>${esc2(x.name)}</b><div class="muted">${esc2(x.sku||'')}</div></td><td>${x.qty}</td><td>${moneyDual(x.amount)}</td></tr>`).join('')||`<tr><td colspan="4" class="dash-empty">No sales data yet.</td></tr>`;
    const recent=(d.recent_sales||[]).map(x=>`<tr><td><b>${esc2(x.invoice_no)}</b><div class="muted">${new Date(x.created_at).toLocaleString()}</div></td><td>${esc2(x.customer_name)}</td><td>${moneyDual(x.total)}</td><td><span class="dash-pill">${esc2(x.payment_method||'cash')}</span></td><td><button class="btn light" onclick="page('sales')">View</button></td></tr>`).join('')||`<tr><td colspan="5" class="dash-empty">No sales yet.</td></tr>`;
    const low=(d.low_stock_items||[]).map(x=>`<div class="dash-list-row"><div><b>${esc2(x.name)}</b><div class="muted">${esc2(x.sku)}</div></div><span class="dash-pill" style="background:#fff1f0;color:#c2413a">${x.quantity} / min ${x.reorder_level}</span></div>`).join('')||`<div class="dash-empty">✓ No low-stock items.</div>`;
    document.getElementById('dashRoot').innerHTML=`
      <div class="dashboard-kpis">
        <div class="card dash-kpi"><small>Today's Sales</small><div class="kpi-value">$${Number(today.sales||0).toFixed(2)}</div><div class="kpi-sub">${today.sales_count||0} invoices today</div><div class="kpi-icon">↗</div></div>
        <div class="card dash-kpi"><small>Today's Purchases</small><div class="kpi-value">$${Number(today.purchases||0).toFixed(2)}</div><div class="kpi-sub">${today.purchases_count||0} purchases today</div><div class="kpi-icon">↙</div></div>
        <div class="card dash-kpi"><small>Today's Expenses</small><div class="kpi-value">$${Number(today.expenses||0).toFixed(2)}</div><div class="kpi-sub">${today.expenses_count||0} expenses today</div><div class="kpi-icon">−</div></div>
        <div class="card dash-kpi"><small>Customer Receivables</small><div class="kpi-value">$${Number(t.customer_receivables||0).toFixed(2)}</div><div class="kpi-sub">Outstanding customer balance</div><div class="kpi-icon">♙</div></div>
      </div>
      <div class="dashboard-kpis dashboard-section">

let liveProducts=[];
const API_BASE = "";
async function apiJSON(url, options={}){
  try{
    const r=await fetch(API_BASE + url, options);
    const d=await r.json().catch(()=>({detail:"Server returned an invalid response"}));
    if(!r.ok){let msg=`HTTP ${r.status}`; try{const j=await r.json(); msg=j.error||j.detail||msg;}catch(_){} throw new Error(msg);}
    return d;
  }catch(e){
    if(e instanceof TypeError || /Failed to fetch|NetworkError|Load failed/i.test(e.message||"")){
      throw new Error("Online API is unavailable. Please refresh the page and try again.");
    }
    throw e;
  }
}

function downloadBlob(blob,filename){const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)}
async function downloadProductsExcel(){
  try{
    const r=await fetch(API+"/api/products/export.xlsx",{cache:"no-store"});
    if(r.ok){ downloadBlob(await r.blob(),"SIF_Products.xlsx"); return; }
    const rows=await apiJSON("/api/products");
    if(!Array.isArray(rows)) throw new Error("Products data is not available");
    const headers=["SKU","Barcode","Name","Category","Type","Cost","Retail Price","Wholesale Price","VIP Price","Quantity","Reorder Level","Warranty Months","IMEI Required","Serial Required","Photo URL"];
    const esc=v=>String(v??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
    const tr=["<table><thead><tr>"+headers.map(h=>"<th>"+esc(h)+"</th>").join("")+"</tr></thead><tbody>"];
    for(const x of rows){const vals=[x.sku,x.barcode,x.name,x.category,x.product_type,x.cost,x.sale_price,x.wholesale_price,x.vip_price,x.quantity,x.reorder_level,x.warranty_months,x.imei_required?"Yes":"No",x.serial_required?"Yes":"No",x.image_url];tr.push("<tr>"+vals.map(esc).map(v=>"<td>"+v+"</td>").join("")+"</tr>")}
    tr.push("</tbody></table>");
    const html="<html><head><meta charset='UTF-8'></head><body>"+tr.join("")+"</body></html>";
    downloadBlob(new Blob([html],{type:"application/vnd.ms-excel;charset=utf-8"}),"SIF_Products.xls");
  }catch(e){alert("Export failed: "+e.message)}
}

function filterLiveProducts(){
  const q=(document.getElementById("liveSearch")?.value||"").toLowerCase();
  const el=document.getElementById("liveProducts"); if(!el)return;
  const rows=liveProducts.filter(p=>`${p.sku} ${p.name} ${p.barcode||""}`.toLowerCase().includes(q));
  el.innerHTML=rows.map(p=>`<tr>
    <td>${p.image_url?`<img class="item-thumb" src="${p.image_url}" alt="">`:`<div class="item-thumb">No photo</div>`}</td>
    <td><b>${esc(p.sku)}</b></td><td>${esc(p.name)}</td><td>${esc(p.barcode||"")}</td>
    <td>$${Number(p.cost).toFixed(2)}</td><td>$${Number(p.sale_price).toFixed(2)}</td><td>$${Number(p.wholesale_price||0).toFixed(2)}</td>
    <td>${p.quantity}</td><td>${p.quantity<=p.reorder_level?'<span class="badge pending">Low</span>':'<span class="badge paid">OK</span>'}</td>
    <td><button class="btn light" onclick="editProduct(${p.id})">Edit</button> <button class="btn danger" onclick="deleteProduct(${p.id})">Delete</button> <button class="btn light" onclick="clearProductPhoto(${p.id})">Delete Photo</button></td>
  </tr>`).join("") || `<tr><td colspan="10" class="empty">No products found.</td></tr>`;
}

async function loadEditCatalogCombos(cat,type){try{const [cats,types]=await Promise.all([apiJSON("/api/categories"),apiJSON("/api/product-types")]);const c=document.getElementById("eCategory"),t=document.getElementById("eType");if(c){c.innerHTML=cats.map(x=>`<option value="${esc(x.name)}">${esc(x.name)}</option>`).join("");c.value=cat}if(t){t.innerHTML=types.map(x=>`<option value="${esc(x.code)}">${esc(x.name)} (${esc(x.code)})</option>`).join("");t.value=type}}catch(e){}}
async function clearEditPhoto(id){if(!confirm("Delete this product photo?"))return;const old=liveProducts.find(x=>x.id===id);if(!old)return;try{await apiJSON("/api/products/"+id,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({sku:old.sku,name:old.name,barcode:old.barcode||null,category:document.getElementById("eCategory")?.value||old.category||"Accessories",product_type:document.getElementById("eType")?.value||old.product_type||"accessory",cost:Number(old.cost||0),sale_price:Number(old.sale_price||0),wholesale_price:Number(old.wholesale_price||0),vip_price:Number(old.vip_price||0),quantity:Number(old.quantity||0),reorder_level:Number(old.reorder_level||0),warranty_months:Number(old.warranty_months||0),imei_required:!!old.imei_required,serial_required:!!old.serial_required,image_url:null})});document.getElementById("eImage").value="";document.getElementById("eImagePreview").removeAttribute("src");await refreshLiveProducts();alert("Photo deleted.")}catch(e){alert(e.message)}}
function esc(v){return String(v).replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
async function saveEditProduct(id){
  const old=liveProducts.find(x=>x.id===id);
  const body={
    sku:eSku.value.trim(),name:eName.value.trim(),barcode:eBarcode.value.trim()||null,
    category:old.category||"Accessories",product_type:old.product_type||"accessory",
    cost:Number(eCost.value||0),sale_price:Number(ePrice.value||0),
    wholesale_price:Number(eWholesale.value||0),vip_price:Number(eVip.value||0),

async function deleteProduct(id){
  const p=liveProducts.find(x=>x.id===id); if(!p)return;
  if(!confirm(`Delete "${p.name}"?`))return;
  try{await apiJSON("/api/products/"+id,{method:"DELETE"});alert("Product deleted.");await refreshLiveProducts();}
  catch(e){alert(e.message)}
}
async function clearProductPhoto(id){
  const p=liveProducts.find(x=>x.id===id); if(!p)return;
  if(!p.image_url)return alert("This product has no photo.");
  if(!confirm(`Delete photo from "${p.name}"?`))return;
  try{
    const body={sku:p.sku,name:p.name,barcode:p.barcode||null,category:p.category||"Accessories",product_type:p.product_type||"accessory",cost:Number(p.cost||0),sale_price:Number(p.sale_price||0),wholesale_price:Number(p.wholesale_price||0),vip_price:Number(p.vip_price||0),quantity:Number(p.quantity||0),reorder_level:Number(p.reorder_level||0),warranty_months:Number(p.warranty_months||0),imei_required:!!p.imei_required,serial_required:!!p.serial_required,image_url:null};
    await apiJSON("/api/products/"+id,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
    await refreshLiveProducts();
  }catch(e){alert(e.message)}
}



function productCard(p){return `<article class="catalog-card">${p.image_url?`<img src="${p.image_url}" alt="${esc(p.name)}">`:`<div class="item-thumb">No Photo</div>`}<h3>${esc(p.name)}</h3><div class="code">${esc(p.sku)} • ${esc(p.barcode||"No barcode")}</div><div class="catalog-price">$${Number(p.sale_price).toFixed(2)}</div><div class="muted">Stock: ${p.quantity} • Wholesale: $${Number(p.wholesale_price||0).toFixed(2)}</div><div class="catalog-actions"><button class="btn light" onclick="editProduct(${p.id})">Edit</button><button class="btn primary" onclick="priceChecker('${esc(p.sku)}')">Price</button></div></article>`}
async function catalogPage(category,title,subtitle){let addCat=category, addType=category==='Mobile Phones'?'mobile':category==='Computers'?'computer':'accessory';modulePage(title,subtitle,`<button class="btn light" onclick="priceChecker()">⌕ Price Checker</button> <button class="btn primary" onclick="openAddProduct('${category}','${addType}')">＋ Add Product</button>`);contentEl.insertAdjacentHTML('beforeend',`<div class="module"><div class="category-pills"><button onclick="catalogPage('Mobile Phones','Mobile Phones','Phones with photo, price, barcode and stock.')">Phones</button><button onclick="catalogPage('Computers','Computers & Laptops','Laptops and computers with photo, price, barcode and stock.')">Computers</button><button onclick="catalogPage('Accessories','Accessories','Accessories with photo, price, barcode and stock.')">Accessories</button><button onclick="stockLivePage()">All Stock</button></div><div id="catalogGrid" class="catalog-grid"></div></div>`);try{let rows=await apiJSON('/api/products');let f=rows.filter(p=>String(p.category).toLowerCase()===category.toLowerCase());document.getElementById('catalogGrid').innerHTML=f.map(productCard).join('')||'<div class="empty">No items found.</div>'}catch(e){document.getElementById('catalogGrid').innerHTML='<div class="empty">Start SIF server first.</div>'}}
let stockData=[];async function stockLivePage(){modulePage('Stock Management','ALL ITEMS — Phones, Computers, Laptops and Accessories.',`<button class="btn primary" onclick="priceChecker()">⌕ Price Checker</button>`);contentEl.insertAdjacentHTML('beforeend',`<div class="module"><div class="toolbar"><input id="stockSearch" placeholder="Search all items / SKU / barcode" oninput="filterStock()"><select id="stockCategory" onchange="filterStock()"><option value="">All Categories</option><option value="Mobile Phones">Phones</option><option value="Computers">Computers</option><option value="Accessories">Accessories</option></select><button class="btn light" onclick="loadStockLive()">Refresh</button></div><div id="stockSummary" class="kpis" style="margin:18px 0"></div><div class="stock-table-wrap"><table><thead><tr><th>Photo</th><th>Code</th><th>Item</th><th>Category</th><th>Barcode</th><th>Cost</th><th>Retail</th><th>Wholesale</th><th>VIP</th><th>Qty</th><th>Status</th><th>Actions</th></tr></thead><tbody id="stockRows"></tbody></table></div></div>`);loadStockLive()}
async function loadStockLive(){try{stockData=await apiJSON('/api/products');renderStockSummary(stockData);renderStock(stockData)}catch(e){let x=document.getElementById('stockRows');if(x)x.innerHTML='<tr><td colspan="12" class="empty">Start SIF server first.</td></tr>';let sm=document.getElementById('stockSummary');if(sm)sm.innerHTML='<div class="kpi"><span>Stock Summary</span><b>Server offline</b></div>'}}
function renderStockSummary(rows){const products=rows.length;const qty=rows.reduce((a,p)=>a+Number(p.quantity||0),0);const cost=rows.reduce((a,p)=>a+Number(p.cost||0)*Number(p.quantity||0),0);const sales=rows.reduce((a,p)=>a+Number(p.sale_price||0)*Number(p.quantity||0),0);const sm=document.getElementById('stockSummary');if(!sm)return;sm.innerHTML=`<div class="kpi"><span>Total Products</span><b>${products.toLocaleString()}</b></div><div class="kpi"><span>Total Quantity</span><b>${qty.toLocaleString()}</b></div><div class="kpi"><span>Total Cost</span><b>$${cost.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}</b><small>${Math.round(cost*Number(settingsCache.usd_lbp||89500)).toLocaleString()} LBP</small></div><div class="kpi"><span>Total Sales Value</span><b>$${sales.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2})}</b><small>${Math.round(sales*Number(settingsCache.usd_lbp||89500)).toLocaleString()} LBP</small></div>`}
function filterStock(){let q=(document.getElementById('stockSearch')?.value||'').toLowerCase(),c=document.getElementById('stockCategory')?.value||'';renderStock(stockData.filter(p=>(!c||p.category===c)&&(`${p.sku} ${p.name} ${p.barcode||''} ${p.category}`).toLowerCase().includes(q)))}
function renderStock(rows){let el=document.getElementById('stockRows');if(!el)return;el.innerHTML=rows.map(p=>`<tr><td>${p.image_url?`<img class="item-thumb" src="${p.image_url}" alt="">`:`<div class="item-thumb"></div>`}</td><td><b>${esc(p.sku)}</b></td><td>${esc(p.name)}</td><td>${esc(p.category)}</td><td>${esc(p.barcode||'')}</td><td>$${Number(p.cost||0).toFixed(2)}</td><td>$${Number(p.sale_price||0).toFixed(2)}</td><td>$${Number(p.wholesale_price||0).toFixed(2)}</td><td>$${Number(p.vip_price||0).toFixed(2)}</td><td><b>${p.quantity}</b></td><td><span class="badge ${p.quantity<=p.reorder_level?'pending':'paid'}">${p.quantity<=p.reorder_level?'LOW STOCK':'IN STOCK'}</span></td><td><button class="btn light" onclick="editProduct(${p.id})">Edit</button> <button class="btn primary" onclick="priceChecker('${esc(p.sku)}')">Price</button></td></tr>`).join('')||'<tr><td colspan="12" class="empty">No stock items.</td></tr>'}
function livePOSPage(){
  modulePage("Point of Sale","Live checkout: select products, build a cart and save the invoice.",
  `<button class="btn light" onclick="cart=[];livePOSPage()">Clear Cart</button>`,
  `<div class="grid2">
    <div class="card"><div class="toolbar"><input id="posSearch" placeholder="Search product or barcode" oninput="renderPOSProducts()"></div><div id="posProducts"></div></div>

      <div id="cartLines"></div>
      <hr><p>Subtotal <b id="cartSub" style="float:right">$0.00</b></p>

function updatePOSProducts(){if(document.getElementById("posProducts")) renderPOSProducts()}
function renderPOSProducts(){
  const el=document.getElementById("posProducts"); if(!el)return;
  const q=(document.getElementById("posSearch")?.value||"").toLowerCase();
  const rows=liveProducts.filter(p=>`${p.name} ${p.sku} ${p.barcode||""}`.toLowerCase().includes(q));
  el.innerHTML=rows.map(p=>`<div class="card" style="display:flex;justify-contentEl:space-between;align-items:center;margin-bottom:8px;padding:12px">
    <div><b>${p.name}</b><div class="muted">${p.sku} • ${p.barcode||"No barcode"} • Stock: ${p.quantity}</div></div>
    <button class="btn primary" ${p.quantity<=0?"disabled":""} onclick="addToCart(${p.id})">$${Number(p.sale_price).toFixed(2)} ＋</button>
  </div>`).join("")||`<div class="empty">No matching products.</div>`;
}
function addToCart(id){
  const p=liveProducts.find(x=>x.id===id); if(!p)return;
  const existing=cart.find(x=>x.product_id===id);
  if(existing){if(existing.quantity<p.quantity)existing.quantity++;}else cart.push({product_id:id,name:p.name,price:Number(p.sale_price),quantity:1,max:p.quantity});
  renderCart();
}
function renderCart(){
  const lines=document.getElementById("cartLines"); if(!lines)return;
  let sub=0;
  lines.innerHTML=cart.map((x,i)=>{let t=x.price*x.quantity;sub+=t;return `<div style="padding:9px 0;border-bottom:1px solid var(--border)">
    <b>${x.name}</b><span style="float:right">$${t.toFixed(2)}</span><div class="muted">Qty <button class="btn light" onclick="changeQty(${i},-1)">−</button> ${x.quantity} <button class="btn light" onclick="changeQty(${i},1)">＋</button></div></div>`}).join("")||`<div class="empty">Cart is empty.</div>`;
  const disc=Number(document.getElementById("saleDiscount")?.value||0), total=Math.max(0,sub-disc);
  document.getElementById("cartSub").textContent="$"+sub.toFixed(2);
  document.getElementById("cartTotal").textContent="$"+total.toFixed(2);
  document.getElementById("cartCount").textContent=cart.reduce((a,x)=>a+x.quantity,0)+" items";
}
function changeQty(i,d){let x=cart[i];x.quantity+=d;if(x.quantity<=0)cart.splice(i,1);else if(x.quantity>x.max)x.quantity=x.max;renderCart()}
async function completeSale(){
  if(!cart.length){alert("Cart is empty.");return}
  const discount=Number(document.getElementById("saleDiscount").value||0);
  try{
    const r=await apiJSON("/api/sales",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({discount,payment_method:document.getElementById("payment").value,
      items:cart.map(x=>({product_id:x.product_id,quantity:x.quantity,unit_price:x.price}))})});
    alert(`Sale completed: ${r.invoice_no} — $${Number(r.total).toFixed(2)}`);
    cart=[]; await refreshLiveProducts(); renderCart();
  }catch(e){alert(e.message)}
}

let settingsCache={usd_lbp:89500,vat_rate:11,vat_enabled:'true',company_name:'SIF Mobile & Computer',invoice_prefix:'INV-'};
async function loadSettings(){try{settingsCache=Object.assign(settingsCache,await apiJSON('/api/settings'))}catch(e){} return settingsCache}
function moneyDual(usd){const u=Number(usd||0), r=Number(settingsCache.usd_lbp||89500);return `<div class="money-row"><span class="money">$${u.toFixed(2)}</span><span class="money">${Math.round(u*r).toLocaleString()} LBP</span></div>`}
function openModal(title,body,actions=''){const old=document.getElementById('globalModal');if(old)old.remove();document.body.insertAdjacentHTML('beforeend',`<div class="modal-back" id="globalModal"><div class="modal-box"><div class="title"><b>${title}</b><button class="btn light" onclick="globalModal.remove()">Close</button></div>${body}<div class="form-actions">${actions}</div></div></div>`)}
function esc2(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}

async function priceChecker(initial=''){
 await loadSettings();
 const popupMode=new URLSearchParams(location.search).get('priceCheckerWindow')==='1';
 openModal('SIF Professional Price Checker',`<div class="toolbar" style="position:sticky;top:55px;background:#fff;z-index:1;padding:10px 0"><input id="pcq" value="${esc2(initial)}" placeholder="Product name / SKU / barcode" style="flex:1"><select id="pct"><option value="retail">Retail</option><option value="wholesale">Wholesale</option><option value="vip">VIP</option></select><button class="btn primary" id="pcCheckBtn">Check Price</button><button class="btn light" onclick="togglePriceCheckerMax()">⛶ Maximize</button>${popupMode?'':'<button class="btn light" onclick="openPriceCheckerWindow(document.getElementById(\'pcq\')?.value||\'\')">↗ Open Window</button>'}</div><div id="pcResults" style="margin-top:18px"></div>`,popupMode?'':`<button class="btn light" onclick="globalModal.remove()">Close</button>`);
 const sel=document.getElementById('pct'), btn=document.getElementById('pcCheckBtn'), q=document.getElementById('pcq');
 if(btn)btn.onclick=runPriceCheck;
 if(sel)sel.onchange=runPriceCheck;
 if(q)q.onkeydown=e=>{if(e.key==='Enter')runPriceCheck()};
 if(initial) await runPriceCheck();
 else await runPriceCheck();
}
function togglePriceCheckerMax(){const m=document.getElementById('globalModal');if(m)m.classList.toggle('pcMaximized')}
function openPriceCheckerWindow(initial=''){
 const q=encodeURIComponent(initial||'');
 const url=location.origin+location.pathname+'?priceCheckerWindow=1&q='+q;
 const w=window.open(url,'SIFPriceChecker','popup=yes,width='+screen.availWidth+',height='+screen.availHeight+',left=0,top=0,resizable=yes,scrollbars=yes');
 if(w){try{w.moveTo(0,0);w.resizeTo(screen.availWidth,screen.availHeight)}catch(e){} w.focus();} else alert('Please allow popups for Price Checker.');
}

async function runPriceCheck(){
 const q=(document.getElementById('pcq')?.value||'').trim().toLowerCase();
 const type=document.getElementById('pct')?.value||'retail';
 const box=document.getElementById('pcResults'); if(!box)return;
 try{
  const rows=await apiJSON('/api/products');
  const matches=rows.filter(p=>!q || `${p.name||''} ${p.sku||''} ${p.barcode||''}`.toLowerCase().includes(q));
  box.innerHTML=matches.map(p=>{
   const price=type==='wholesale'?Number(p.wholesale_price||0):type==='vip'?Number(p.vip_price||0):Number(p.sale_price||0);
   const label=type==='wholesale'?'WHOLESALE PRICE':type==='vip'?'VIP PRICE':'RETAIL PRICE';
   const lbp=Math.round(price*Number(settingsCache.usd_lbp||89500));
   return `<article class="card" style="max-width:560px"><div style="display:flex;gap:16px;align-items:center">${p.image_url?`<img src="${p.image_url}" style="width:90px;height:90px;object-fit:cover;border-radius:12px">`:`<div class="item-thumb">No Photo</div>`}<div><h2 style="margin:0 0 6px">${esc2(p.name)}</h2><div class="muted">SKU: ${esc2(p.sku)} • Barcode: ${esc2(p.barcode||'-')} • Stock: ${p.quantity}</div></div></div><div style="margin-top:18px"><div class="muted">${label}</div><div class="price-big">$${price.toFixed(2)}</div><div style="font-size:20px;font-weight:800">${lbp.toLocaleString()} LBP</div></div></article>`;
  }).join('')||'<div class="empty">No matching product.</div>';
 }catch(e){box.innerHTML=`<div class="empty">Cannot load products: ${esc2(e.message)}</div>`}
}

async function customers(){const rows=await apiJSON('/api/customers').catch(()=>[]);modulePage('Customers','Customer accounts, balances and history.',`<button class="btn primary" onclick="customerForm()">＋ Add Customer</button>`,`<div class="toolbar"><input id="custQ" placeholder="Search customer / phone / code" oninput="filterCustomers()"></div><div id="custTable"></div>`);window._custRows=rows;renderCustomers(rows)}
function renderCustomers(rows){const el=document.getElementById('custTable');if(!el)return;el.innerHTML=`<table><thead><tr><th>Code</th><th>Customer</th><th>Phone</th><th>Address</th><th>Balance</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${esc2(x.code)}</td><td>${esc2(x.name)}</td><td>${esc2(x.phone||'')}</td><td>${esc2(x.address||'')}</td><td>${moneyDual(x.balance)}</td></tr>`).join('')}</tbody></table>`}

async function printOfficialDocument(type,id){
 try{
  const x=await apiJSON(type==='sale'?`/api/sales/${id}`:`/api/purchases/${id}`);
  const isSale=type==='sale';
  const title=isSale?'OFFICIAL SALES INVOICE':'OFFICIAL PURCHASE INVOICE';
  const party=isSale?(x.customer_name||'Walk-in Customer'):(x.supplier_name||'Walk-in Supplier');
  const lines=x.items.map(i=>`<tr><td>${esc2(i.name)}</td><td>${esc2(i.sku||'')}</td><td style="text-align:center">${i.quantity}</td><td style="text-align:right">$${Number(isSale?i.unit_price:i.unit_cost).toFixed(2)}</td><td style="text-align:right">$${Number(i.total).toFixed(2)}</td></tr>`).join('');
  const html=`<div id="officialPrintArea" class="invoice-preview" style="background:#fff;padding:28px;color:#111"><div style="display:flex;justify-content:space-between;gap:20px"><div>${companyInvoiceHeader(title)}</div><div style="text-align:right"><b>${esc2(x.invoice_no)}</b><br>${new Date(x.created_at).toLocaleString()}</div></div><hr><p><b>${isSale?'Customer':'Supplier'}:</b> ${esc2(party)}<br><b>Payment:</b> ${esc2(x.payment_method)}</p><table style="width:100%;border-collapse:collapse"><tr><th style="text-align:left">Item</th><th style="text-align:left">SKU</th><th>Qty</th><th style="text-align:right">Unit</th><th style="text-align:right">Total</th></tr>${lines}</table><hr><p>Subtotal <b style="float:right">$${Number(x.subtotal).toFixed(2)}</b></p>${isSale?`<p>Discount <b style="float:right">$${Number(x.discount||0).toFixed(2)}</b></p>`:''}<p>VAT ${x.vat_enabled?`(${Number(x.vat_rate).toFixed(2)}%)`: '(No VAT)'} <b style="float:right">$${isSale?Number(x.vat_amount||0).toFixed(2):Number(x.total-x.subtotal).toFixed(2)}</b></p><h2>Total <b style="float:right">$${Number(x.total).toFixed(2)}</b></h2><div style="text-align:right;font-size:18px;font-weight:700">${Math.round(Number(x.total)*Number(settingsCache.usd_lbp||89500)).toLocaleString()} LBP</div><div style="display:flex;justify-content:space-between;margin-top:55px"><span>${isSale?'Customer':'Supplier'} Signature: __________</span><span>Authorized Signature: __________</span></div></div>`;
  openModal(title,html,`<button class="btn primary" onclick="printOpenArea('officialPrintArea','${title}')">🖨 Print Official Invoice</button>`);
 }catch(e){alert('Print failed: '+e.message)}
}
function printOpenArea(id,title){const a=document.getElementById(id);if(!a)return;const w=window.open('','_blank','width=900,height=900');if(!w){alert('Allow popups for printing.');return}w.document.write(`<html><head><title>${esc2(title)}</title><style>body{font-family:Arial;padding:30px}table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid #ddd}hr{border:0;border-top:1px solid #ddd}</style></head><body>${a.outerHTML}</body></html>`);w.document.close();w.focus();setTimeout(()=>w.print(),250)}

async function editSale(id){
 try{const [x,products,customers]=await Promise.all([apiJSON(`/api/sales/${id}`),apiJSON('/api/products'),apiJSON('/api/customers')]);
  let lines=x.items.map(i=>({product_id:i.product_id,quantity:i.quantity,unit_price:i.unit_price}));
  const prodOpts=(selected)=>products.map(p=>`<option value="${p.id}" ${Number(p.id)===Number(selected)?'selected':''}>${esc2(p.name)} — ${esc2(p.sku)} — Stock ${p.quantity}</option>`).join('');
  const render=()=>lines.map((l,i)=>`<div class="card editSaleLine" style="padding:12px;margin:8px 0"><div class="form-grid"><div style="grid-column:1/-1"><label>Product</label><select class="esProd" data-i="${i}">${prodOpts(l.product_id)}</select></div><div><label>Quantity</label><input class="esQty" data-i="${i}" type="number" min="1" value="${l.quantity}"></div><div><label>Unit Price $</label><input class="esPrice" data-i="${i}" type="number" step="0.01" min="0" value="${Number(l.unit_price).toFixed(2)}"></div><div><button class="btn danger" onclick="removeEditLine('sale',${i})">Remove</button></div></div></div>`).join('');
  window._editProducts=products; window._editSaleLines=lines; window._editSaleRender=render;
  openModal(`Edit Sale ${x.invoice_no}`,`<div class="form-grid"><div><label>Customer</label><select id="esCustomer"><option value="">Walk-in Customer</option>${customers.map(c=>`<option value="${c.id}" ${Number(c.id)===Number(x.customer_id)?'selected':''}>${esc2(c.name)}</option>`).join('')}</select></div><div><label>Payment</label><select id="esPayment"><option value="cash" ${x.payment_method==='cash'?'selected':''}>Cash</option><option value="card" ${x.payment_method==='card'?'selected':''}>Card</option><option value="account" ${x.payment_method==='account'?'selected':''}>Customer Account</option></select></div><div><label>Discount $</label><input id="esDiscount" type="number" step="0.01" value="${Number(x.discount||0)}"></div><div><label>VAT Rate %</label><input id="esVatRate" type="number" step="0.01" value="${Number(x.vat_rate||0)}"></div></div><label class="switch"><input id="esVat" type="checkbox" ${x.vat_enabled?'checked':''}> VAT Enabled</label><div style="margin-top:12px" id="editSaleLines">${render()}</div><button class="btn light" onclick="addEditLine('sale')">＋ Add Item</button>`,`<button class="btn primary" onclick="saveSaleEdit(${id})">Save Changes</button>`);
 }catch(e){alert('Edit sale failed: '+e.message)}
}
function addEditLine(type){const products=window._editProducts||[]; if(type==='sale'){window._editSaleLines.push({product_id:products[0]?.id||1,quantity:1,unit_price:Number(products[0]?.sale_price||0)});document.getElementById('editSaleLines').innerHTML=window._editSaleRender()}}
function removeEditLine(type,i){const a=type==='sale'?window._editSaleLines:window._editPurchaseLines;a.splice(i,1);document.getElementById(type==='sale'?'editSaleLines':'editPurchaseLines').innerHTML=(type==='sale'?window._editSaleRender():window._editPurchaseRender())}
async function saveSaleEdit(id){try{const lines=[...document.querySelectorAll('.editSaleLine')].map((el,i)=>({product_id:Number(el.querySelector('.esProd').value),quantity:Number(el.querySelector('.esQty').value),unit_price:Number(el.querySelector('.esPrice').value)}));const r=await apiJSON(`/api/sales/${id}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({customer_id:document.getElementById('esCustomer').value?Number(document.getElementById('esCustomer').value):null,discount:Number(document.getElementById('esDiscount').value||0),payment_method:document.getElementById('esPayment').value,vat_enabled:document.getElementById('esVat').checked,vat_rate:Number(document.getElementById('esVatRate').value||0),currency:'USD',items:lines})});alert(`Sale ${r.invoice_no} updated.`);globalModal.remove();sales()}catch(e){alert('Save sale failed: '+e.message)}}
async function deleteSale(id,inv){if(!confirm(`Delete ${inv}? Stock will be restored.`))return;try{await apiJSON(`/api/sales/${id}`,{method:'DELETE'});sales()}catch(e){alert('Delete sale failed: '+e.message)}}

    <div style="grid-column:1/-1"><label>Problem / Diagnosis <span style="font-weight:400;color:#64748b">(optional)</span></label><textarea id="repProblem" placeholder="Describe the customer problem or diagnosis (optional)">${esc2(x.problem||'')}</textarea></div>

async function fillRepairCustomer(){
  const id=Number(document.getElementById('repCust').value||0); if(!id)return;
  const cs=await apiJSON('/api/customers').catch(()=>[]); const c=cs.find(z=>Number(z.id)===id); if(c){document.getElementById('repPhone').value=c.phone||'';document.getElementById('repAddress').value=c.address||'';}
}

async function saveRepair(id=null){try{
  const payload={customer_id:repCust.value?Number(repCust.value):null,device_name:repDevice.value.trim(),imei_or_serial:repSerial.value.trim(),problem:repProblem.value.trim(),status:repStatus.value,estimated_cost:Number(repCost.value||0),sales_price:Number(repSales.value||0),customer_phone:repPhone.value.trim(),customer_address:repAddress.value.trim(),technician:repTech.value.trim(),warranty_days:Number(repWarranty.value||0),notes:repNotes.value.trim()};
  const r=await apiJSON(id?`/api/repairs/${id}`:'/api/repairs',{method:id?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
  globalModal.remove();alert(id?'Repair updated successfully':`Repair ${r.ticket_no} saved successfully`);repairs();
}catch(e){alert(e.message)}}

async function repairEdit(id){const rows=await apiJSON('/api/repairs');const x=rows.find(r=>Number(r.id)===Number(id));if(x)repairForm(x)}

async function openReportDetail(type){

function printReturn(type,id,no,total){const w=window.open('','_blank','width=800,height=700');if(!w)return;w.document.write(`<html><body style="font-family:Arial;padding:30px"><h1>SIF Mobile & Computer</h1><h2>${type==='sale'?'OFFICIAL SALES RETURN':'OFFICIAL PURCHASE RETURN'}</h2><p>Return No: <b>${esc2(no)}</b></p><h2>Total: $${Number(total).toFixed(2)}</h2><p>Date: ${new Date().toLocaleString()}</p></body></html>`);w.document.close();w.print()}

const CODE128_B_PATTERNS=[
"212222","222122","222221","121223","121322","131222","122213","122312","132212","221213","221312","231212","112232","122132","122231","113222","123122","123221","223211","221132","221231","213212","223112","312131","311222","321122","321221","312212","322112","322211","212123","212321","232121","111323","131123","131321","112313","132113","132311","211313","231113","231311","112133","112331","132131","113123","113321","133121","313121","211331","231131","213113","213311","213131","311123","311321","331121","312113","312311","332111","314111","221411","431111","111224","111422","121124","121421","141122","141221","112214","112412","122114","122411","142112","142211","241211","221114","413111","241112","134111","111242","121142","121241","114212","124112","124211","411212","421112","421211","212141","214121","412121","111143","111341","131141","114113","114311","411113","411311","113141","114131","311141","411131","211412","211214","211232","2331112"];
function code128Svg(value,width=330,height=105){
  value=String(value??'').trim(); if(!value)return '';
  for(const ch of value){if(ch.charCodeAt(0)<32||ch.charCodeAt(0)>126)return '<div class="muted">Barcode contains unsupported characters.</div>';}
  const codes=[104]; let checksum=104;
  for(let i=0;i<value.length;i++){const c=value.charCodeAt(i)-32;codes.push(c);checksum+=c*(i+1)}
  codes.push(checksum%103,106);
  let x=8, rects=''; const module=2;
  for(const code of codes){const pat=CODE128_B_PATTERNS[code];let bar=true;for(const ch of pat){const w=Number(ch)*module;if(bar)rects+=`<rect x="${x}" y="6" width="${w}" height="70" fill="#000"/>`;x+=w;bar=!bar}}
  return `<svg xmlns="http://www.w3.org/2000/svg" width="${width}" height="${height}" viewBox="0 0 ${width} ${height}" role="img" aria-label="Barcode ${esc2(value)}"><rect width="100%" height="100%" fill="#fff"/>${rects}<text x="${width/2}" y="96" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#111">${esc2(value)}</text></svg>`;
}
function barcodeLabelHtml(p,copies=1){const n=Math.max(1,Math.min(100,Number(copies||1)));return Array.from({length:n},()=>`<div class="barcode-label"><div class="barcode-name">${esc2(p.name)}</div>${code128Svg(p.barcode,320,105)}<div class="barcode-sku">${esc2(p.sku||'')}</div></div>`).join('')}
function printBarcodeProduct(p,copies=1){if(!p?.barcode)return alert('This product has no barcode. Generate one first.');const w=window.open('','_blank','width=700,height=850');if(!w){alert('Allow popups for printing.');return}w.document.write(`<html><head><title>Barcode - ${esc2(p.name)}</title><style>@page{size:auto;margin:8mm}body{font-family:Arial;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px}.barcode-label{width:340px;min-height:145px;border:1px dashed #aaa;padding:7px;text-align:center;break-inside:avoid}.barcode-label svg{max-width:100%;height:auto}.barcode-name{font-size:14px;font-weight:800;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.barcode-sku{font-size:11px;color:#555}.report-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}.report-card{border:1px solid #dbe3ec;background:#fff;border-radius:14px;padding:18px;text-align:left;cursor:pointer;display:flex;justify-content:space-between;align-items:flex-end;min-height:145px;box-shadow:0 3px 12px rgba(16,24,40,.05)}.report-card:hover{transform:translateY(-1px);box-shadow:0 7px 20px rgba(16,24,40,.10)}.report-card h2{margin:8px 0}.report-card span{color:#667085}.report-card>b{color:#0ea5e9}.table-wrap{overflow:auto;margin-top:14px}.table-wrap table{min-width:760px}</style></head><body>${barcodeLabelHtml(p,copies)}</body></html>`);w.document.close();w.focus();setTimeout(()=>w.print(),250)}
async function barcodeCenterPage(){
  modulePage('Generate & Print Barcode','Search by product name, SKU or barcode. Generate a new internal barcode, then print labels.',`<button class="btn light" onclick="loadBarcodeCenter()">↻ Refresh</button>` ,`<div class="toolbar"><input id="barcodeSearch" placeholder="Search by name / SKU / barcode" oninput="renderBarcodeCenter()" style="max-width:520px"><input id="barcodeCopies" type="number" min="1" max="100" value="1" title="Copies" style="max-width:110px"><span class="muted" style="align-self:center">copies</span></div><div id="barcodeCenterRows"></div>`);
  await loadBarcodeCenter();
}
let barcodeProducts=[];
async function loadBarcodeCenter(){try{barcodeProducts=await apiJSON('/api/products');renderBarcodeCenter()}catch(e){const el=document.getElementById('barcodeCenterRows');if(el)el.innerHTML=`<div class="empty">${esc2(e.message||'Start SIF server first.')}</div>`}}
function renderBarcodeCenter(){const el=document.getElementById('barcodeCenterRows');if(!el)return;const q=(document.getElementById('barcodeSearch')?.value||'').toLowerCase().trim();const rows=barcodeProducts.filter(p=>`${p.name} ${p.sku} ${p.barcode||''}`.toLowerCase().includes(q));el.innerHTML=rows.map(p=>`<div class="card" style="margin:10px 0;display:grid;grid-template-columns:72px 1fr auto;gap:14px;align-items:center"><div>${p.image_url?`<img src="${p.image_url}" class="item-thumb" style="width:72px;height:72px">`:`<div class="item-thumb" style="width:72px;height:72px">No Photo</div>`}</div><div><h3 style="margin:0 0 4px">${esc2(p.name)}</h3><div class="muted">SKU: ${esc2(p.sku)} · Stock: ${p.quantity}</div><div style="margin-top:5px"><b>Barcode:</b> ${esc2(p.barcode||'Not assigned')}</div>${p.barcode?`<div style="margin-top:8px;max-width:360px">${code128Svg(p.barcode,330,95)}</div>`:''}</div><div class="actions" style="flex-wrap:wrap;justify-content:flex-end">${p.barcode?`<button class="btn light" onclick='printBarcodeById(${p.id})'>🖨 Print Barcode</button>`:`<button class="btn primary" onclick="generateBarcodeForProduct(${p.id})">⚡ Generate Barcode</button>`}</div></div>`).join('')||'<div class="empty">No matching products.</div>'}
async function generateBarcodeForProduct(id){try{const p=barcodeProducts.find(x=>Number(x.id)===Number(id));if(!p)return;let r;if(p.barcode){if(!confirm(`This item already has barcode ${p.barcode}. Generate a new barcode and replace it?`))return;/* remove old barcode first through product update is intentionally avoided; server returns existing */return alert('This item already has a barcode. Use the existing barcode, or clear it in Edit Product first.')}
r=await apiJSON(`/api/products/${id}/generate-barcode`,{method:'POST'});await loadBarcodeCenter();alert(`Barcode generated: ${r.barcode}`)}catch(e){alert('Barcode generation failed: '+e.message)}}
async function printBarcodeById(id){const p=barcodeProducts.find(x=>Number(x.id)===Number(id));if(p)printBarcodeProduct(p,document.getElementById('barcodeCopies')?.value||1)}

// Print item barcodes directly from official sales/purchase invoices.
async function printOfficialDocument(type,id){
  try{
    const x=await apiJSON(type==='sale'?`/api/sales/${id}`:`/api/purchases/${id}`); const isSale=type==='sale';
    const title=isSale?'OFFICIAL SALES INVOICE':'OFFICIAL PURCHASE INVOICE'; const party=isSale?(x.customer_name||'Walk-in Customer'):(x.supplier_name||'Walk-in Supplier');
    const lines=x.items.map(i=>`<tr><td>${esc2(i.name)}</td><td>${esc2(i.sku||'')}</td><td>${esc2(i.barcode||'No barcode')}</td><td style="text-align:center">${i.quantity}</td><td style="text-align:right">$${Number(isSale?i.unit_price:i.unit_cost).toFixed(2)}</td><td style="text-align:right">$${Number(i.total).toFixed(2)}</td></tr>`).join('');
    const barcodeBlock=x.items.filter(i=>i.barcode).map(i=>`<div style="display:inline-block;text-align:center;margin:8px 12px 8px 0;vertical-align:top">${code128Svg(i.barcode,250,88)}<div style="font-size:11px;font-weight:700">${esc2(i.name)}</div></div>`).join('');
    const html=`<div id="officialPrintArea" class="invoice-preview" style="background:#fff;padding:28px;color:#111">${companyInvoiceHeader(title)}<div style="text-align:right;margin-top:-28px"><b>${esc2(x.invoice_no)}</b><br>${new Date(x.created_at).toLocaleString()}</div><hr><p><b>${isSale?'Customer':'Supplier'}:</b> ${esc2(party)}<br><b>Payment:</b> ${esc2(x.payment_method)}</p><table style="width:100%;border-collapse:collapse"><tr><th style="text-align:left">Item</th><th style="text-align:left">SKU</th><th style="text-align:left">Barcode</th><th>Qty</th><th style="text-align:right">Unit</th><th style="text-align:right">Total</th></tr>${lines}</table><hr><p>Subtotal <b style="float:right">$${Number(x.subtotal).toFixed(2)}</b></p>${isSale?`<p>Discount <b style="float:right">$${Number(x.discount||0).toFixed(2)}</b></p>`:''}<p>VAT ${x.vat_enabled?`(${Number(x.vat_rate).toFixed(2)}%)`:'(No VAT)'} <b style="float:right">$${isSale?Number(x.vat_amount||0).toFixed(2):Number(x.total-x.subtotal).toFixed(2)}</b></p><h2>Total <b style="float:right">$${Number(x.total).toFixed(2)}</b></h2><div style="text-align:right;font-size:18px;font-weight:700">${Math.round(Number(x.total)*Number(settingsCache.usd_lbp||89500)).toLocaleString()} LBP</div>${barcodeBlock?`<hr><h3>ITEM BARCODES</h3><div>${barcodeBlock}</div>`:''}<div style="display:flex;justify-content:space-between;margin-top:55px"><span>${isSale?'Customer':'Supplier'} Signature: __________</span><span>Authorized Signature: __________</span></div></div>`;
    openModal(title,html,`<button class="btn primary" onclick="printOpenArea('officialPrintArea','${title}')">🖨 Print Official Invoice + Barcodes</button>`);
  }catch(e){alert('Print failed: '+e.message)}
}

async function exportSifDatabase(){try{const r=await fetch(API+'/database/export',{cache:'no-store'});if(!r.ok)throw new Error((await r.text())||'Export failed');downloadBlob(await r.blob(),'SIF_Mobile_Computer_Backup.db');alert('Database backup exported successfully.')}catch(e){alert('Database export failed: '+e.message)}}
async function importSifDatabase(){const input=document.createElement('input');input.type='file';input.accept='.db,.sqlite,.sqlite3';input.onchange=async()=>{const f=input.files?.[0];if(!f)return;if(!confirm('Import this database? The current database will be backed up automatically and replaced.'))return;try{const fd=new FormData();fd.append('file',f);const r=await fetch(API+'/database/import',{method:'POST',body:fd});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.detail||'Import failed');alert(`Database imported successfully. Backup created: ${d.backup||'yes'}. Reloading SIF...`);location.reload()}catch(e){alert('Database import failed: '+e.message)}};input.click()}
async function resetSifDatabase(mode){const factory=mode==='factory';const msg=factory?'FACTORY RESET will erase the current database and restore SIF defaults + demo catalog. Continue?':'RESET DATABASE will erase business records and start fresh. Continue?';if(!confirm(msg))return;if(!confirm('Last confirmation: a backup will be created first. Continue?'))return;try{const r=await apiJSON('/api/database/reset?mode='+encodeURIComponent(mode),{method:'POST'});alert(`${factory?'Factory reset':'Database reset'} complete. Backup: ${r.backup||'none'}. Reloading SIF...`);location.reload()}catch(e){alert('Reset failed: '+e.message)}}
