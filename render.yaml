services:
  - type: web
    name: sif-mobile-computer
    runtime: python
    region: frankfurt
    plan: starter
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.0
      - key: DATABASE_URL
        value: sqlite:////var/data/sif_mobile.db
    disk:
      name: sif-data
      mountPath: /var/data
      sizeGB: 1
